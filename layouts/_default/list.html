{{ define "header" }}
  {{ partials.Include "page-header.html" . }}
{{ end }}
{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      {{- .Content -}}
    </section>

    {{ $paginator := .Paginate .Pages 6 }}
    <section class="flex-ns flex-wrap justify-start">
      {{ range $paginator.Pages }}
        <div class="w-100 w-third-l mb4 relative">
          {{ .Render "summary" }}
        </div>
      {{ end }}
    </section>{{/* former internal template */}}
    {{ partial "pagination.html" . }}
  </article>
{{ end }}
